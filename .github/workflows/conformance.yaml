name: Formae Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

# Least privilege:
#   This workflow only needs to read the repo.
#   jdx/mise-action gets github.token for API calls, which read access covers.
#
# Grant write per-job if ever required, never at the top level.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  check:
    name: Check
    # Apple's container runtime needs Virtualization.framework, which
    # GitHub-hosted macOS runners do not expose (VZErrorDomain Code=2).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      MISE_ENV: conformance
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true
          cache_restore_retry_budget: 30s
          cache_save_retry_budget: 90s
          version: 2026.11.12

      - run: container system start --enable-kernel-install

      - name: Conformance Tests
        run: |
          mise run test:conformance
