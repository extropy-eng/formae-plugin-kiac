[secrets.fnox]
profile = "runners"

[tasks."gh:auth"]
description = "authenticates with GitHub before starting runners on this macOS host"
secrets = "GH_ORG_TOKEN"
run = "echo $GH_ORG_TOKEN | gh auth login --with-token"

[tasks."runners:apply"]
description = "configures GitHub Actions runners on this macOS host"
secrets = "GH_ORG_TOKEN"
run = "sh .config/mise/tasks/runners/apply-script.sh"
