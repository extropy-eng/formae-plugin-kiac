[secrets.fnox]
profile = "runners"

[tasks."gh:auth"]
description = "authenticates with GitHub before starting runners on this macOS host"
secrets = "GH_ORG_TOKEN"
run = "echo $GH_ORG_TOKEN | gh auth login --with-token"

[tasks."runners:apply"]
description = "configures GitHub Actions runners on this macOS host"
secrets = "GH_ORG_TOKEN"
# gh prefers GH_TOKEN over the system-wide GITHUB_TOKEN, which lacks org admin scope
run = "GH_TOKEN=$GH_ORG_TOKEN mac-runner apply --file .github/mac-runner.yaml --yes"
