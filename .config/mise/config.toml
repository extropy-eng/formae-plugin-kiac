min_version = { hard = "2026.11.7" }

[settings]
env_shell_expand = true
experimental = true
locked = false
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
task.quiet = true
task.run_auto_install = true

[shell_alias]
mdlint = "mise run --env=docs lint:markdown"

[tools]
# Lisette 0.13.0's bindgen only knows Go 1.26 stdlib typedefs.
# Go 1.27 aliases `encoding/json.RawMessage` to `jsontext.Value`,
# which Lisette cannot resolve, so this project pins the older Go toolchain.
go = "prefix:1.26"

pkl = "latest"

[tools.lisette]
version = "latest"
version_prefix = "lisette-v"
postinstall = """
  completions_dir="${XDG_CACHE_HOME:-~/.cache}/zsh/completions"
  mkdir -p $completions_dir
  lis complete zsh >| $completions_dir/_lis.zsh
"""

[vars]
formae_repo = "github.com/platform-engineering-labs/formae"

# plugin metadata is read from its manifest so that it never drifts
plugin_name = "$(pkl eval -x name formae-plugin.pkl || echo 'undefined')"
plugin_namespace = "$(pkl eval -x namespace formae-plugin.pkl || echo 'UNDEFINED')"
plugin_version = "$(pkl eval -x version formae-plugin.pkl || echo '0.0.0')"

go_flags = "-trimpath"

[tasks."validate:manifest"]
description = "validates the plugin manifest"
run = """
  pkl eval formae-plugin.pkl --format json 1> /dev/null
  echo "Plugin manifest validated successfully"
"""
cache.enabled = true
sources = ["formae-plugin.pkl"]
outputs = []

[tasks.schema-version]
description = "dervies the schema version from the plugin manifest"
run = "mkdir -p schema/pkl && echo {{ vars.plugin_version }} >| schema/pkl/VERSION"
cache.enabled = true
sources = ["formae-plugin.pkl"]
outputs = ["schema/pkl/VERSION"]

[tasks."validate:schema"]
description = "validates the plugin schema against formae conventions"
depends = "schema-version"
run = """
  lis check . --deny warnings 1> /dev/null 2>&1

  cd target/ && cp -p ../formae-plugin.pkl .
  go run {{ vars.formae_repo }}/pkg/plugin/testutil/cmd/verify-schema \
    --namespace {{ vars.plugin_namespace }} ../schema/pkl
"""
cache.enabled = true
sources = ["lisette.toml", "schema"]
outputs = []

[tasks.lint]
description = "lints and typechecks test and production code"
run = "lis check . --deny warnings"
cache.enabled = true
sources = ["lisette.toml", "src/**/*.lis"]
outputs = ["target"]

[tasks."test"]
description = "transpiles, builds and runs all tests"
run = "lis test --go-flags {{ vars.go_flags }}"
cache.enabled = true
sources = ["lisette.toml", "src/**/*.lis"]
outputs = ["target"]

[tasks.build]
description = "build the plugin binary"
depends = "schema-version"
run = """
	lis build --go-flags "{{ vars.go_flags }} -o bin/{{ vars.plugin_name }}" --sourcemap
"""
cache.enabled = true
sources = ["lisette.toml", "src/**/*.lis", "!src/**/*.test.lis"]
outputs = ["target"]

[tasks.check]
description = "runs all static checks and tests"
depends = [
  "lint",
  "test",
  "validate:manifest",
  "validate:schema",
]
